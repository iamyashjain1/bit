name: Deploy to VM

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: copy ssh into machine
        run: |
          mkdir -p ~/.ssh
          cd ~/.ssh
          echo "${{ secrets.my_gcp_key }}" > my_gcp_key
          chmod 600 my_gcp_key
          ls -ltr

      - name: SSH into VM
        run: |
          ssh -i ~/.ssh/my_gcp_key -o StrictHostKeyChecking=no yashjain200502@35.246.23.173 << 'EOF'
            set -e
            pwd
            ls -la
            echo "Successfully connected to VM"
            if [ -d "bit" ]; then
              echo "Directory 'bit' already exists. Pulling latest changes."
              cd bit
              git pull origin master
            else
              echo "Directory 'bit' does not exist. Cloning repository."
              git clone https://github.com/yashjain200502/bit.git
              cd bit
            fi

            if [ -d "venv" ]; then
              echo "Virtual environment already exists. Activating it."
              source venv/bin/activate
            else
              echo "Virtual environment does not exist. Creating and activating it."
              python3 -m venv venv
              source venv/bin/activate
            fi
            pip install -r requirements.txt
            flask --app app run --host=0.0.0.0 --port=5000
          EOF
